version: '3.8'

services:
  notflix-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: notflix-api
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/notflix
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:5173
      - JWT_SECRET=change_me_in_production
      - SESSION_SECRET=change_me_in_production
      # Add other Cloudinary and Google OAuth secrets here in production
    depends_on:
      - mongo
      - redis
    restart: unless-stopped
    volumes:
      - ./backend/logs:/app/logs

  mongo:
    image: mongo:6
    container_name: notflix-mongo
    ports:
      - "27017:27017"
    volumes:
      - notflix_mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: notflix-redis
    ports:
      - "6379:6379"
    volumes:
      - notflix_redis_data:/data
    restart: unless-stopped

volumes:
  notflix_mongo_data:
  notflix_redis_data:
